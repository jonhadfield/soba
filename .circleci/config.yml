version: 2
jobs:
  build:
    docker:
      # Must track the toolchain directive in go.mod (go1.26.7), not the go
      # directive. On an older image Go silently downloads a matching toolchain
      # on every build, and would fail outright under GOTOOLCHAIN=local.
      - image: cimg/go:1.26.7
    # The tests read GIT_BACKUP_DIR to decide where to write bundles. The
    # directory below was created but never exported, so anything depending on
    # the variable saw whatever the environment happened to hold.
    environment:
      GIT_BACKUP_DIR: /home/circleci/project/backup
    steps:
      - checkout
      - run:
          name: make git backups dir
          command: mkdir -p "$GIT_BACKUP_DIR"
      # Live GitHub integration tests are opt-in (SOBA_LIVE_GITHUB_TESTS) and
      # not enabled here, so CI no longer depends on a rate-limited live token;
      # deterministic GitHub coverage runs via mocked API + local git fixtures.
      - run: go test -v -p 1 -parallel 1 -failfast ./...

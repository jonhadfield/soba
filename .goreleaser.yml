version: 2

project_name: soba

env:
  - GO111MODULE=on
  - GOPROXY=https://proxy.golang.org
  - CGO_ENABLED=0

before:
  hooks:
    - make clean
    - go mod tidy

builds:
  - id: macos-soba
    binary: soba
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }} -X main.sha={{ .ShortCommit }} -X main.buildDate={{ .Date }} -X main.tag={{ .Tag }}"
    hooks:
      post:
        # Sign and notarize the binary just built for this GOARCH. Skip when
        # AC_PASSWORD is unset so local/unsigned releases still work; when it
        # is set, gon failures must fail the release (do not swallow $?).
        - |
          sh -c '
          set -eu
          if [ -z "${AC_PASSWORD:-}" ]; then
            echo "AC_PASSWORD unset; skipping macOS signed zip for {{ .Target }}"
            exit 0
          fi
          cat > /tmp/soba_gon_{{ .Arch }}.hcl << EOF
          source = ["{{ .Path }}"]
          bundle_id = "uk.co.lessknown.soba"
          apple_id {
            username = "jon@lessknown.co.uk"
            password = "@env:AC_PASSWORD"
          }
          sign {
            application_identity = "Developer ID Application: Jonathan Hadfield (VBZY8FBYR5)"
          }
          zip {
            output_path = "./dist/soba_darwin_{{ .Arch }}_signed.zip"
          }
          EOF
          gon /tmp/soba_gon_{{ .Arch }}.hcl
          '

  - id: soba
    binary: soba
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    goarm:
      - "7"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }} -X main.sha={{ .ShortCommit }} -X main.buildDate={{ .Date }} -X main.tag={{ .Tag }}"

archives:
  - id: regular
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

# Upload notarized macOS zips only when the post-hooks produced them. A static
# release.extra_files glob fails the release when AC_PASSWORD is unset and no
# signed zips exist.
publishers:
  - name: macos-signed-zips
    cmd: >
      bash -c 'shopt -s nullglob;
      files=(./dist/soba_darwin*_signed.zip);
      if ((${#files[@]}==0)); then
        echo "No signed macOS zips to upload";
        exit 0;
      fi;
      gh release upload "{{ .Tag }}" "${files[@]}" --clobber -R jonhadfield/soba'
    env:
      - GH_TOKEN={{ .Env.GITHUB_TOKEN }}

release:
  github:
    owner: jonhadfield
    name: soba
  prerelease: auto
  name_template: '{{ .Tag }}'

announce:
  skip: true

snapshot:
  version_template: "{{ .Tag }}-devel"

changelog:
  sort: asc
  filters:
    # Anchored to conventional-commit prefixes. These were previously bare
    # substrings matched anywhere in the message, so "test" also matched
    # "testify", "tests" and "test-file", silently dropping real entries from
    # every release: 1.5.0 lost the testify bump, the CI test-workflow PR and
    # a Sonar fix.
    exclude:
      - '^test(\([^)]*\))?:'
      - '^docs?(\([^)]*\))?:'
      - '^ignore(\([^)]*\))?:'

checksum:
  name_template: 'checksums.txt'
